[package]
name = "txtx-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "txtx-app"

[lib]
name = "txtx_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Tauri (only used in tauri binary, not in server binary)
tauri = { version = "2.11", features = [], optional = true }
tauri-plugin-opener = { version = "2.5", optional = true }
tauri-plugin-dialog = { version = "2.7", optional = true }
tauri-plugin-fs = { version = "2.5", optional = true }

# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["gzip", "brotli", "deflate", "charset"] }
scraper = "0.27"
serde_yaml = "0.9"
regex = "1"
zhconv = "0.4"
rand = "0.8"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["full"] }
encoding_rs = "0.8"
bytes = "1"
epub-builder = "0.8"
backon = "1"
kumo = { version = "0.3", features = ["xpath", "llm"], default-features = false }
schemars = "1"
# To enable wreq TLS fingerprinting (requires cmake + MSVC on Windows):
#   cargo build --features stealth
governor = "0.10"
sxd-document = "0.3"
sxd-xpath = "0.4"
sxd_html = "0.1"
async-trait = "0.1"
tokio-stream = "0.1"
which = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
uuid = { version = "1", features = ["v4"] }
async-openai = "0.28"
backoff = "0.4"

[[bin]]
name = "txtx-app"
path = "src/main.rs"
required-features = ["tauri-build"]

[[bin]]
name = "txtx-server"
path = "src/server_main.rs"

[features]
default = []
stealth = ["kumo/stealth"]
tauri-build = ["tauri", "tauri-plugin-opener", "tauri-plugin-dialog", "tauri-plugin-fs"]

